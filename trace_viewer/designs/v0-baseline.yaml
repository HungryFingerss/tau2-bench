# The default llm_agent, as it stands in the benchmark.
#
# Decisions are written by hand from the source. tests/test_designs.py checks every
# cited symbol and line range against the real code, and checks that the prompt text
# and tool list below match what the code and saved runs contain. If a cited file
# changes, the viewer warns that line numbers may be off.

version: v0-baseline
title: Default llm_agent
description: >-
  The benchmark's stock agent: a thin wrapper that sends the policy and the full
  conversation to the model on every turn and acts on whatever comes back. Nearly
  every rule in the policy reaches the model as text, with no code behind it.

applies_to:
  agent_implementation: llm_agent

# What record_run.py saves a git diff of. config.py and the evaluator are included
# because local edits there change how a run behaves or is scored, and the run's
# saved git commit does not show uncommitted changes.
code_paths:
  - src/tau2/agent
  - src/tau2/config.py
  - src/tau2/evaluator

parameters:
  model: Set per run with --agent-llm.
  temperature: 0.0, from DEFAULT_LLM_ARGS_AGENT unless --agent-llm-args overrides it.
  seed: A per-trial seed set by the runner, so each trial is reproducible.
  num_retries: 3, from DEFAULT_MAX_RETRIES. These retry failed API calls only.
  max_tokens: Not set. The provider default applies.
  max_steps: 200, from DEFAULT_MAX_STEPS.
  max_errors: 10, from DEFAULT_MAX_ERRORS.

system_prompt:
  instruction: |-
    You are a customer service agent that helps the user according to the <policy> provided below.
    In each turn you can either:
    - Send a message to the user.
    - Make a tool call.
    You cannot do both at the same time.

    Try to be helpful and always follow the policy. Always make sure you generate valid JSON only.
  template: |-
    <instructions>
    {agent_instruction}
    </instructions>
    <policy>
    {domain_policy}
    </policy>
  domain_policy: >-
    The retail policy from data/tau2/domains/retail/policy.md, then a blank line, then
    the language pack's agent_language_clause. That clause is inside <policy> in the
    prompt, but it is not in the policy field saved in results.json.

decisions:
  - id: D1
    name: System prompt is fixed instructions plus the policy
    status: implemented
    what: >-
      Builds one system prompt per conversation from a short instruction, the retail
      policy, and a language line. It never changes during the conversation.
    code_enforces: Which text is sent. It is the same for every task.
    left_to_model: Understanding and following everything in the prompt.
    source:
      - file: src/tau2/agent/llm_agent.py
        symbol: AGENT_INSTRUCTION
        lines: [24, 32]
      - file: src/tau2/agent/llm_agent.py
        symbol: SYSTEM_PROMPT
        lines: [34, 41]
      - file: src/tau2/agent/llm_agent.py
        symbol: LLMAgent.system_prompt
        lines: [88, 92]
      - file: src/tau2/runner/build.py
        symbol: agent_domain_policy
        lines: [82, 89]
      - file: src/tau2/multilingual/runtime.py
        symbol: agent_language_guidance
        lines: [843, 864]

  - id: D2
    name: Every tool is offered on every call
    status: implemented
    what: >-
      All 16 retail tools are sent on each model call as function schemas built from
      their docstrings, with tool_choice set to auto.
    code_enforces: >-
      The tool list is fixed. No tool is hidden based on the conversation, so write
      tools are offered before identity is verified.
    left_to_model: Which tool to call, when, and with what arguments.
    source:
      - file: src/tau2/runner/build.py
        symbol: build_agent
        lines: [144, 144]
      - file: src/tau2/environment/environment.py
        symbol: Environment.get_tools
        lines: [77, 83]
      - file: src/tau2/utils/llm_utils.py
        symbol: _generate_once
        lines: [648, 650]

  - id: D3
    name: Identity verification is prompt-only
    status: not_handled
    what: >-
      The policy tells the agent to find the user ID first, but nothing checks that it
      did. Account tools run whether or not identity was verified.
    code_enforces: Nothing.
    left_to_model: Remembering to verify identity, and doing it before anything else.
    source:
      - file: data/tau2/domains/retail/policy.md
        lines: [10, 10]
      - file: src/tau2/orchestrator/orchestrator.py
        symbol: BaseOrchestrator._execute_tool_calls
        lines: [327, 343]

  - id: D4
    name: One model call per incoming message
    status: implemented
    what: >-
      Each customer message or tool result triggers one model call. If the reply has
      tool calls, they run and the result triggers the next call. Otherwise the text
      goes to the customer.
    code_enforces: The turn order between agent, tools and customer.
    left_to_model: Whether to reply or call a tool on each turn.
    source:
      - file: src/tau2/agent/llm_agent.py
        symbol: LLMAgent._generate_next_message
        lines: [125, 145]
      - file: src/tau2/orchestrator/orchestrator.py
        symbol: Orchestrator.step
        lines: [840, 949]

  - id: D5
    name: The agent never ends the conversation itself
    status: implemented
    what: >-
      The agent has no way to finish. A run ends when the simulated customer sends a
      stop token, or when the step or error limit is reached.
    code_enforces: The stop tokens and the limits.
    left_to_model: Nothing. The agent keeps replying until it is stopped.
    source:
      - file: src/tau2/agent/llm_agent.py
        symbol: LLMAgent.is_stop
        lines: [81, 86]
      - file: src/tau2/orchestrator/orchestrator.py
        symbol: Orchestrator.step
        lines: [862, 864]
      - file: src/tau2/orchestrator/orchestrator.py
        symbol: Orchestrator._check_termination
        lines: [755, 771]
      - file: src/tau2/user/user_simulator.py
        symbol: UserSimulator.is_stop
        lines: [141, 155]

  - id: D6
    name: Tool calls are not validated before they run
    status: not_handled
    what: >-
      Whatever the model produces goes straight to the tool. A bad name or bad
      arguments only surface as an exception from the tool itself.
    code_enforces: Nothing before execution. Each tool checks its own inputs.
    left_to_model: Producing a real tool name and valid arguments.
    source:
      - file: src/tau2/environment/environment.py
        symbol: Environment.get_response
        lines: [473, 498]
      - file: src/tau2/environment/toolkit.py
        symbol: ToolKitBase.use_tool
        lines: [138, 142]

  - id: D7
    name: Tool errors go back to the model as plain text
    status: implemented
    what: >-
      Any exception becomes a tool message starting with "Error:". The model sees only
      that text, with no error flag. There is no retry logic, and 10 errors end the run.
    code_enforces: Catching exceptions and counting errors towards the limit.
    left_to_model: Noticing the error and deciding what to do about it.
    source:
      - file: src/tau2/environment/environment.py
        symbol: Environment.get_response
        lines: [487, 489]
      - file: src/tau2/orchestrator/orchestrator.py
        symbol: BaseOrchestrator._execute_tool_calls
        lines: [340, 341]
      - file: src/tau2/orchestrator/orchestrator.py
        symbol: Orchestrator._check_termination
        lines: [768, 770]
      - file: src/tau2/utils/llm_utils.py
        symbol: to_litellm_messages
        lines: [256, 263]

  - id: D8
    name: The full history is resent on every call
    status: implemented
    what: >-
      Every model call contains the system prompt and all messages so far. Nothing is
      trimmed or summarized, and the model's reasoning from earlier turns is dropped.
    code_enforces: Sending all past messages in order.
    left_to_model: >-
      Keeping track of everything by rereading it, without its own earlier reasoning.
    source:
      - file: src/tau2/agent/llm_agent.py
        symbol: LLMAgent._generate_next_message
        lines: [137, 137]
      - file: src/tau2/utils/llm_utils.py
        symbol: to_litellm_messages
        lines: [234, 255]

  - id: D9
    name: Model parameters are minimal
    status: implemented
    what: >-
      Temperature 0, a per-trial seed, and 3 retries on API failures. No token limit
      is set.
    code_enforces: These defaults, unless overridden on the command line.
    left_to_model: Nothing.
    source:
      - file: src/tau2/config.py
        symbol: DEFAULT_LLM_ARGS_AGENT
        lines: [34, 34]
      - file: src/tau2/config.py
        symbol: DEFAULT_MAX_RETRIES
        lines: [72, 72]
      - file: src/tau2/agent/base/llm_config.py
        symbol: LLMConfigMixin.set_seed
        lines: [41, 48]
      - file: src/tau2/utils/llm_utils.py
        symbol: _generate_once
        lines: [612, 613]

  - id: D10
    name: The greeting is scripted
    status: implemented
    what: >-
      The conversation opens with a fixed line from the language pack. No model call
      is made for it, but the model sees it as its own message in the history.
    code_enforces: The exact opening line.
    left_to_model: Nothing.
    source:
      - file: src/tau2/orchestrator/orchestrator.py
        symbol: BaseOrchestrator.initial_agent_message
        lines: [146, 153]
      - file: src/tau2/orchestrator/orchestrator.py
        symbol: DEFAULT_FIRST_AGENT_MESSAGE
        lines: [48, 50]

  - id: D11
    name: Confirmation before writes is prompt-only
    status: not_handled
    what: >-
      The policy and tool descriptions ask for an explicit yes, but write tools run
      with no check that the customer gave one.
    code_enforces: Nothing.
    left_to_model: Listing the details, asking, and waiting for a yes.
    source:
      - file: data/tau2/domains/retail/policy.md
        lines: [16, 16]
      - file: src/tau2/orchestrator/orchestrator.py
        symbol: BaseOrchestrator._execute_tool_calls
        lines: [327, 343]

  - id: D12
    name: One action per turn is prompt-only
    status: not_handled
    what: >-
      The instructions forbid mixing text with a tool call, but the benchmark's check
      for this is off by default, so a mixed message is accepted and both parts apply.
    code_enforces: Nothing, unless --enforce-communication-protocol is passed.
    left_to_model: Doing one thing per turn.
    source:
      - file: src/tau2/agent/llm_agent.py
        symbol: AGENT_INSTRUCTION
        lines: [26, 29]
      - file: src/tau2/cli.py
        symbol: add_run_args
        lines: [247, 251]

  - id: D13
    name: Repeated tool calls are not stopped
    status: not_handled
    what: >-
      Nothing notices the same failing call being made again and again. The loop only
      ends when the error limit is reached.
    code_enforces: Nothing, apart from the error limit in D7.
    left_to_model: Changing course after a call fails.
    source:
      - file: src/tau2/orchestrator/orchestrator.py
        symbol: BaseOrchestrator._execute_tool_calls
        lines: [327, 343]

  - id: D14
    name: Reading tool results is left to the model
    status: not_handled
    what: >-
      Tool results arrive as raw JSON. Nothing filters or summarizes them, so for
      example unavailable variants look the same as available ones until the model
      reads each available flag.
    code_enforces: Nothing beyond converting the result to JSON.
    left_to_model: Reading every field correctly, including counting and filtering.
    source:
      - file: src/tau2/environment/environment.py
        symbol: Environment.get_response
        lines: [491, 491]
      - file: src/tau2/environment/environment.py
        symbol: Environment.to_json_str
        lines: [420, 449]
      - file: src/tau2/domains/retail/tools.py
        symbol: RetailTools.get_product_details
        lines: [393, 407]

  - id: D15
    name: No record of the customer's conditions or a plan
    status: not_handled
    what: >-
      The agent's only state is the message list. It has no structured record of what
      the customer wants, their conditions, what was agreed, or what is left to do.
    code_enforces: Nothing.
    left_to_model: Tracking conditions and changes of mind from the raw conversation.
    source:
      - file: src/tau2/agent/llm_agent.py
        symbol: LLMAgentState
        lines: [44, 48]

  - id: D16
    name: Store rules are enforced inside the tools
    status: implemented
    what: >-
      Tools check rules such as order status, allowed cancel reasons, that a new item
      is available and belongs to the same product, gift card balance, and which
      payment method a refund can go to.
    code_enforces: These rules, by raising an error the model then sees.
    left_to_model: Choosing an action that passes them, and recovering when one fails.
    source:
      - file: src/tau2/domains/retail/tools.py
        symbol: RetailTools.cancel_pending_order
        lines: [190, 237]
      - file: src/tau2/domains/retail/tools.py
        symbol: RetailTools.exchange_delivered_order_items
        lines: [239, 316]
      - file: src/tau2/domains/retail/tools.py
        symbol: RetailTools.modify_pending_order_items
        lines: [499, 587]
      - file: src/tau2/domains/retail/tools.py
        symbol: RetailTools.return_delivered_order_items
        lines: [708, 759]

  - id: D17
    name: Escalation is prompt-only
    status: not_handled
    what: >-
      The policy says when to transfer to a human. The tool only returns "Transfer
      successful", and nothing checks that the transfer was justified.
    code_enforces: Nothing.
    left_to_model: Deciding that a request truly cannot be handled.
    source:
      - file: data/tau2/domains/retail/policy.md
        lines: [24, 24]
      - file: src/tau2/domains/retail/tools.py
        symbol: RetailTools.transfer_to_human_agents
        lines: [776, 790]

  - id: D18
    name: Malformed tool-call JSON crashes the simulation
    status: not_handled
    what: >-
      Tool arguments are parsed with no guard. Invalid JSON raises an exception, so the
      whole simulation fails and is retried as an infrastructure error, and the model
      never gets a chance to correct itself.
    code_enforces: Nothing.
    left_to_model: Producing valid JSON. The instruction only asks it to.
    source:
      - file: src/tau2/utils/llm_utils.py
        symbol: _generate_once
        lines: [704, 711]
      - file: src/tau2/runner/progress.py
        symbol: run_with_retry
        lines: [96, 107]

# Decisions suggested when a label is added on a task. They can be changed per task.
label_links:
  wrong-variant-choice: [D14, D15]
  misread-tool-output: [D14]
  incomplete-lookup: [D15, D17]
  malformed-tool-call: [D6, D13, D18]
  ignored-customer-change: [D15]
  skipped-identity-check: [D3]
  unconfirmed-write: [D11]
  setup-problem: []

