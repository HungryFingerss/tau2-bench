# The 7 tools exactly as sent to the model, from each module's NAME, DESCRIPTION and
# PARAMETERS. Kind: write if it can write to the store, generic for the transfer.
tools:
- name: verify_customer
  kind: read
  description: 'Verify the customer''s identity. Do this before anything else. Give EITHER
    their email, OR their first name, last name and zip code. Returns their account: default
    address, payment methods, and all orders with status and items.'
  parameters:
    type: object
    properties:
      email:
        type: string
        description: Customer's email.
      first_name:
        type: string
      last_name:
        type: string
      zip:
        type: string
        description: Zip code of the customer's address.
    required: []
- name: get_order
  kind: read
  description: 'Show full details of one of the verified customer''s orders: items with item
    IDs, product IDs and prices, payments, tracking, and which actions are possible for the
    order''s current status.'
  parameters:
    type: object
    properties:
      order_id:
        type: string
        description: 'Order ID, e.g. #W2378156.'
    required:
    - order_id
- name: find_variants
  kind: read
  description: 'Find the variants (item options) of a product, e.g. all T-shirts, or only
    blue ones in size L. Give product_id (from get_order) or product_name. Optionally give
    the options the customer wants, e.g. {"color": "blue", "size": "L"}. Shows which variants
    are available, their item IDs and prices, and the closest alternatives when nothing available
    matches.'
  parameters:
    type: object
    properties:
      product_id:
        type: string
        description: Product ID, e.g. product_9523456873.
      product_name:
        type: string
        description: Product name, e.g. T-Shirt.
      options:
        type: object
        description: Option name -> wanted value.
        additionalProperties:
          type: string
    required: []
- name: find_replacement
  kind: read
  description: 'Find the replacement for an item in one of the customer''s orders, keeping
    everything the same except the options the customer wants changed. Give order_id, item_id
    (from get_order) and changes, e.g. {"color": "blue"}. Shows the replacement item ID, whether
    it is available, the price difference, and the closest available options if not.'
  parameters:
    type: object
    properties:
      order_id:
        type: string
        description: 'Order ID, e.g. #W2378156.'
      item_id:
        type: string
        description: The item to replace, e.g. item_1151293680.
      changes:
        type: object
        description: 'Only the options to change: name -> new value.'
        additionalProperties:
          type: string
    required:
    - order_id
    - item_id
    - changes
- name: prepare_change
  kind: read
  description: 'Prepare a change to an order or to the customer''s default address. This does
    NOT make the change: it checks it and returns a summary to read to the customer. Only
    after the customer clearly says yes, call confirm_change with the change number. Pick
    one kind and give only its inputs:

    - cancel_order: needs order_id, reason. Example: {"kind": "cancel_order", "order_id":
    "#W6247578", "reason": "no longer needed"}

    - change_order_address: needs order_id, address. Example: {"kind": "change_order_address",
    "order_id": "#W6247578", "address": {"address1": "12 Main St", "address2": "Apt 4", "city":
    "Austin", "state": "TX", "country": "USA", "zip": "78701"}}

    - change_order_payment: needs order_id, payment_method_id. Example: {"kind": "change_order_payment",
    "order_id": "#W6247578", "payment_method_id": "gift_card_1234567"}

    - change_order_items: needs order_id, items, payment_method_id. Example: {"kind": "change_order_items",
    "order_id": "#W6247578", "items": [{"item_id": "item_3799046073", "new_item_id": "item_2060066974"}],
    "payment_method_id": "credit_card_9513926"}

    - return_items: needs order_id, item_ids, payment_method_id. Example: {"kind": "return_items",
    "order_id": "#W2378156", "item_ids": ["item_1151293680"], "payment_method_id": "credit_card_9513926"}

    - exchange_items: needs order_id, items, payment_method_id. Example: {"kind": "exchange_items",
    "order_id": "#W2378156", "items": [{"item_id": "item_4983901480", "new_item_id": "item_7747408585"}],
    "payment_method_id": "credit_card_9513926"}

    - change_default_address: needs address. Example: {"kind": "change_default_address", "address":
    {"address1": "12 Main St", "address2": "", "city": "Austin", "state": "TX", "country":
    "USA", "zip": "78701"}}

    For change_order_items and exchange_items, put EVERY item in one call: each order allows
    this only once. item_id / new_item_id come from get_order / find_replacement / find_variants.
    payment_method_id comes from verify_customer.'
  parameters:
    type: object
    properties:
      kind:
        type: string
        enum:
        - cancel_order
        - change_order_address
        - change_order_payment
        - change_order_items
        - return_items
        - exchange_items
        - change_default_address
      order_id:
        type: string
      reason:
        type: string
        enum:
        - no longer needed
        - ordered by mistake
      items:
        type: array
        items:
          type: object
          properties:
            item_id:
              type: string
            new_item_id:
              type: string
          required:
          - item_id
          - new_item_id
      item_ids:
        type: array
        items:
          type: string
      payment_method_id:
        type: string
      address:
        type: object
        properties:
          address1:
            type: string
          address2:
            type: string
          city:
            type: string
          state:
            type: string
          country:
            type: string
          zip:
            type: string
    required:
    - kind
- name: confirm_change
  kind: write
  description: Make a prepared change, after the customer has clearly said yes to its summary.
    Give the change number from prepare_change. If the customer wants anything different,
    call prepare_change again instead.
  parameters:
    type: object
    properties:
      change_number:
        type: integer
        description: e.g. 1
    required:
    - change_number
- name: transfer_to_human
  kind: generic
  description: Transfer the customer to a human agent. This ENDS the conversation. Use it
    only when (a) the customer asks for a human, supervisor or representative, or (b) they
    need something no tool can do, e.g. undo a cancellation. If a request is against the rules
    (e.g. a refund to a different card), first explain that it can't be done; transfer only
    if they then ask for a human. Before transferring, finish everything the customer already
    agreed to. Give a short summary of the customer's issue.
  parameters:
    type: object
    properties:
      summary:
        type: string
        description: The customer's issue, in one or two sentences.
    required:
    - summary
