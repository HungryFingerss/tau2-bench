    name: The model sees a clean history
    status: implemented
    addresses: [D7, D8]
    what: >-
      Once the model has recovered from a failed step (a later tool call worked, or a
      message reached the customer), the failed calls, their errors and the notes about
      rejected replies are left out of what it sees. An error that states a fact about
      the store or the rules is kept as a short note. Every tool error says whether it
      is a fact. Customer messages, successes and code's notes always stay; the log
      keeps everything and counts what was hidden.
    code_enforces: The model doesn't see its own old mistakes, but keeps what they taught.
