# My own agent for the retail domain, in fde_agent/.
#
# Written by hand from the source, like v0-baseline.yaml. tests/test_designs.py checks
# every cited symbol and line range against the real code, and checks that the prompt
# text and tool list below match the code and the saved runs. If a cited file
# changes, the viewer warns that line numbers may be off.
#
# Decision ids are F1, F2, ... so they are never confused with the baseline's D1-D18.
# `addresses` lists the baseline decisions each one replaces or fixes, if any.

version: v1-fde-agent
title: fde_agent
description: >-
  My own agent. The model sees short instructions and 7 combined tools instead of the
  policy and the 15 store tools. Code keeps working notes, reads the store's data,
  checks every model reply before anything runs, and owns the moments that matter:
  identity, the change summary, the customer's yes, and the transfer. Every internal
  step goes to the agent's own log, fde_agent_log.json.

applies_to:
  agent_implementation: fde_agent

# What record_run.py starts. It registers fde_agent with the benchmark, then hands
# the same arguments to tau2's own command line.
entry_point: [uv, run, python, -m, fde_agent.run, run]

# What record_run.py saves a git diff of.
code_paths:
  - fde_agent/

# The tool calls in results.json are store calls that our tools send, not calls to
# the 7 tools the model sees. The viewer's invalid-call check uses this design's
# tool list for them: the store's own tools, exactly as the benchmark defines them.
store_tools_from: v0-baseline

parameters:
  model: >-
    Set per run with --agent-llm. Without it, ollama_chat/gpt-oss:20b
    (agent.DEFAULT_MODEL).
  temperature: >-
    0.0, from DEFAULT_LLM_ARGS_AGENT unless --agent-llm-args overrides it. The model
    client also defaults to 0.0.
  seed: A per-trial seed set by the runner (FdeAgent.set_seed), passed to every call.
  model_call_attempts: >-
    3 per model call (model_client.ATTEMPTS), each with generate()'s own 3 API retries.
    Broken tool-call JSON is never retried: it goes back to the model as an error.
  max_failed_tries: >-
    5 failing tries in a row (driver.MAX_FAILED_TRIES), then code sends a safe message.
  max_tokens: Not set. The provider default applies.
  max_steps: 200, from DEFAULT_MAX_STEPS. Only store calls and messages are steps.
  max_errors: 10, from DEFAULT_MAX_ERRORS. Only store errors count.

system_prompt:
  file: fde_agent/instructions.md
  composition: >-
    The whole system prompt is fde_agent/instructions.md, stripped
    (prompt.load_instructions). No policy text and no language clause. Notes from code
    (a summary was shown, a reply was blocked, a call was rejected) are added later as
    extra system messages, and are in the agent's log as `note` events.
  instruction: |-
    You are a customer service agent for an online store. You help one customer per conversation with their orders: cancelling or changing pending orders, returning or exchanging delivered orders, changing their default address, and questions about their profile, their orders and our products.

    ## How to talk
    - Write short, friendly, plain text. No tables, no markdown, no headings.
    - When you need information, ask one clear question at a time.
    - Only state facts the customer told you or a tool showed you. Don't guess, and don't give personal opinions or recommendations.
    - Never show the customer internal IDs: item IDs (item_...), product IDs (product_...) or payment IDs (credit_card_..., gift_card_..., paypal_...). Describe items by name and options, and payment methods like "your Mastercard ending 2478". Order numbers (#W...) are fine.

    ## Start: verify the customer
    Before anything else, verify the customer with verify_customer, using their email, or their first name, last name and zip code. Ask for these if you don't have them. A user ID alone is not enough, even if the customer gives one.

    ## Never decide for the customer
    If the customer hasn't told you something you need, ask. Never pick it yourself:
    - the reason for a cancellation ("no longer needed" or "ordered by mistake")
    - the payment method to pay or receive a price difference, or where a refund goes
    - which order, which items, or which option they want

    ## Finding facts
    - get_order: one order's items, prices, payments, and what is possible for its status.
    - find_variants: a product's options, and which ones are available.
    - find_replacement: the same item with only the changes the customer asked for.
    Use what these tools return. If a tool says something isn't possible or isn't available, tell the customer plainly and offer the alternatives it showed.

    ## Making a change
    1. Gather everything first: every item the customer wants changed or exchanged in that order, and any address or payment change. Do address and payment changes before an item change, because after an item change the order can't be changed again.
    2. Call prepare_change. It checks the change; it does not make it. The system then shows the customer the summary itself, so don't repeat or reword it.
    3. Wait for the customer's answer. If they clearly say yes, call confirm_change with the change number. If they want anything different, call prepare_change again.
    4. Never say a change is done until confirm_change has succeeded.

    ## When a request can't be done
    If a request is against the store's rules, explain that it can't be done, and don't look for workarounds. Use transfer_to_human only as its description says.

    ## Tools
    Call one tool at a time, and never write to the customer in the same reply as a tool call. When a tool returns an error, read it: it says what to fix.

decisions:
  - id: F1
    name: Own short instructions instead of the full policy
    status: implemented
    addresses: [D1]
    what: >-
      The system prompt is instructions.md, about a page, instead of the benchmark's
      instruction plus the whole retail policy. Rules that code enforces are not
      repeated to the model. A coverage table quotes every rule sentence of policy.md
      and points at the code or instruction line that handles it.
    code_enforces: >-
      Which text is sent. A test fails if a policy rule is quoted by no row of the
      table, or if a row points at code or instruction text that no longer exists.
    left_to_model: The rules that stay in the instructions, such as asking instead of guessing.
    source:
      - file: fde_agent/instructions.md
        lines: [1, 34]
      - file: fde_agent/prompt.py
        symbol: load_instructions
        lines: [8, 9]
