    status: implemented
    addresses: [D15]
    what: >-
      When an item change, return or exchange is prepared, the result for the model
      lists the customer's other orders (in the status that kind needs) that have the
      same product, so a request for "all of them" isn't half done. The customer's
      summary is unchanged, and the model is told not to change them without asking.
